<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 주간 상황판</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f7f4;color:#1a1a18;font-size:14px}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e8e6df;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.toolbar h1{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-nav{display:flex;align-items:center;gap:5px;flex-shrink:0}
.week-nav button{background:none;border:1px solid #d5d3cc;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:#1a1a18}
.week-nav button:hover{background:#f1efe8}
.week-label{font-size:12px;color:#5f5e5a;min-width:130px;text-align:center}
.btn-sm{background:none;border:1px solid #d5d3cc;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:#1a1a18;white-space:nowrap;flex-shrink:0}
.btn-sm:hover{background:#f1efe8}
.btn-save-all{background:#1a1a18;color:#fff;border-color:#1a1a18}
.btn-save-all:hover{background:#3a3a38}
.save-status{font-size:11px;flex-shrink:0}
.save-ok{color:#166534}.save-err{color:#991b1b}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px;background:#fff;border-bottom:1px solid #e8e6df}
.leg-item{display:flex;align-items:center;gap:3px;font-size:11px;color:#5f5e5a}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.table-wrap{overflow-x:auto;padding:12px 16px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th{background:#fff;color:#5f5e5a;font-weight:500;padding:7px 9px;border:1px solid #e8e6df;text-align:left;position:sticky;top:49px;z-index:5}
th.name-col{width:86px;min-width:86px;position:sticky;left:0;z-index:6;background:#fff}
td{border:1px solid #e8e6df;padding:5px 7px;vertical-align:top;background:#fff;min-width:126px}
td.name-cell{background:#fafaf8;font-weight:600;white-space:nowrap;position:sticky;left:0;z-index:4;min-width:86px;width:86px}
.name-inner{display:flex;align-items:center;gap:5px}
.avatar{width:22px;height:22px;border-radius:50%;background:#e6f1fb;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#185fa5;flex-shrink:0}
.cell-inner{display:flex;flex-direction:column;gap:3px;min-height:40px}
.task-chip{display:flex;align-items:flex-start;gap:3px;padding:3px 7px;border-radius:9px;font-size:11px;font-weight:500;cursor:pointer;border:none;text-align:left;width:100%;line-height:1.4}
.chip-text{flex:1;word-break:break-all;white-space:pre-wrap}
.chip-del{opacity:0;background:none;border:none;cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0;color:inherit;line-height:1}
.task-chip:hover .chip-del{opacity:0.55}
.chip-del:hover{opacity:1!important}
.add-task{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:5px;border:1px dashed #d5d3cc;background:none;cursor:pointer;color:#888780;font-size:11px;width:100%;margin-top:2px}
.add-task:hover{background:#f8f7f4;color:#5f5e5a}
.cat-blue{background:#dbeafe;color:#1e40af}
.cat-green{background:#dcfce7;color:#166534}
.cat-amber{background:#fef3c7;color:#92400e}
.cat-coral{background:#fee2e2;color:#991b1b}
.cat-purple{background:#ede9fe;color:#5b21b6}
.cat-gray{background:#f3f4f6;color:#374151}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:20;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:1.3rem;width:310px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,0.14)}
.modal h3{font-size:14px;font-weight:600;margin-bottom:.9rem}
.modal label{font-size:11px;color:#5f5e5a;display:block;margin-bottom:3px;font-weight:500}
.modal textarea{width:100%;border:1px solid #d5d3cc;border-radius:6px;padding:6px 8px;font-size:13px;resize:vertical;min-height:68px;font-family:inherit;outline:none;margin-bottom:10px}
.modal textarea:focus,.modal input:focus{border-color:#6b6b68}
.modal input{width:100%;border:1px solid #d5d3cc;border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;outline:none;margin-bottom:12px}
.cat-picker{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.cat-btn{padding:3px 9px;border-radius:9px;border:2px solid transparent;font-size:11px;font-weight:500;cursor:pointer;opacity:0.5;transition:opacity .12s}
.cat-btn.selected{opacity:1;border-color:currentColor}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:5px 14px;border-radius:6px;border:1px solid #d5d3cc;font-size:13px;cursor:pointer;background:none}
.modal-actions .btn-primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
.modal-actions button:hover{opacity:0.8}
.loader{display:none;position:fixed;inset:0;background:rgba(248,247,244,.82);z-index:30;align-items:center;justify-content:center;font-size:13px;color:#5f5e5a;gap:8px}
.loader.on{display:flex}
.spinner{width:16px;height:16px;border:2px solid #d5d3cc;border-top-color:#1a1a18;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="spinner"></div><span id="loader-msg">불러오는 중…</span></div>

<div class="toolbar">
  <h1>📋 팀 주간 상황판</h1>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <span class="week-label" id="week-label"></span>
    <button onclick="changeWeek(1)">›</button>
  </div>
  <button class="btn-sm" onclick="openMemberModal()">+ 팀원</button>
  <button class="btn-sm btn-save-all" onclick="saveAll()">💾 저장</button>
  <span class="save-status" id="save-status"></span>
</div>

<div class="legend">
  <div class="leg-item"><span class="leg-dot" style="background:#60a5fa"></span>제작/편집</div>
  <div class="leg-item"><span class="leg-dot" style="background:#4ade80"></span>취재/서치</div>
  <div class="leg-item"><span class="leg-dot" style="background:#fbbf24"></span>브랜디드</div>
  <div class="leg-item"><span class="leg-dot" style="background:#f87171"></span>회의/데스킹</div>
  <div class="leg-item"><span class="leg-dot" style="background:#a78bfa"></span>기획/제안</div>
  <div class="leg-item"><span class="leg-dot" style="background:#9ca3af"></span>기타/휴가</div>
</div>

<div class="table-wrap">
  <table id="board"><thead id="board-head"></thead><tbody id="board-body"></tbody></table>
</div>

<div class="modal-bg" id="task-modal">
  <div class="modal">
    <h3 id="modal-title">업무 추가</h3>
    <label>업무 내용 (Ctrl+Enter 저장)</label>
    <textarea id="task-text" placeholder="예: [페이블5] 편집 완료"></textarea>
    <label>카테고리</label>
    <div class="cat-picker">
      <button class="cat-btn cat-blue selected" data-cat="blue"   onclick="selectCat(this)">제작/편집</button>
      <button class="cat-btn cat-green"          data-cat="green"  onclick="selectCat(this)">취재/서치</button>
      <button class="cat-btn cat-amber"          data-cat="amber"  onclick="selectCat(this)">브랜디드</button>
      <button class="cat-btn cat-coral"          data-cat="coral"  onclick="selectCat(this)">회의/데스킹</button>
      <button class="cat-btn cat-purple"         data-cat="purple" onclick="selectCat(this)">기획/제안</button>
      <button class="cat-btn cat-gray"           data-cat="gray"   onclick="selectCat(this)">기타/휴가</button>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('task-modal')">취소</button>
      <button class="btn-primary" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="member-modal">
  <div class="modal">
    <h3>팀원 추가</h3>
    <label>이름</label>
    <input type="text" id="new-member" placeholder="예: 홍길동" />
    <div class="modal-actions">
      <button onclick="closeModal('member-modal')">취소</button>
      <button class="btn-primary" onclick="addMember()">추가</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwghhvObb6axjNlrlRkuqwRC_bskj2H7aXSV4WiCyV_e5j9pBqosfmeJXGXh2E0oUkt/exec';
const DAYS = ['월','화','수','목','금'];
const DEFAULT_MEMBERS = ['조기호','소환욱','안혜민','여현교','김인선','이기은','채지원','이세미','이미선','김채현'];

let state = { members:[...DEFAULT_MEMBERS], tasks:{}, weekOffset:0 };
let editing=null, selCat='blue', dirty=false;

function getWeekDates(offset){
  const now=new Date(),day=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+offset*7);
  return Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function toWeekKey(offset){
  const d=getWeekDates(offset)[0];
  const jan4=new Date(d.getFullYear(),0,4);
  const wk=Math.ceil(((d-jan4)/86400000+jan4.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`;}

function showLoader(on,msg){
  document.getElementById('loader').className='loader'+(on?' on':'');
  if(msg)document.getElementById('loader-msg').textContent=msg;
}
function setStatus(msg,ok){
  const el=document.getElementById('save-status');
  el.textContent=msg;
  el.className='save-status '+(ok?'save-ok':'save-err');
  if(ok)setTimeout(()=>{el.textContent='';},3000);
}

/* GET 방식으로 통일 — CORS 우회 */
async function api(params){
  const qs=Object.entries(params)
    .map(([k,v])=>`${k}=${encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)}`)
    .join('&');
  const res=await fetch(`${SCRIPT_URL}?${qs}`);
  return res.json();
}

async function loadFromSheet(){
  showLoader(true,'불러오는 중…');
  try{
    const wk=toWeekKey(state.weekOffset);
    const rows=await api({action:'read',weekKey:wk});
    state.tasks={};
    state.members.forEach(m=>state.tasks[m]={});
    if(Array.isArray(rows)){
      rows.forEach(r=>{
        const m=r.member,d=Number(r.dayIdx);
        if(!state.tasks[m])state.tasks[m]={};
        if(!state.tasks[m][d])state.tasks[m][d]=[];
        state.tasks[m][d].push({t:r.taskText,c:r.category});
      });
    }
    dirty=false; setStatus('불러오기 완료',true);
  }catch(e){setStatus('불러오기 실패: '+e.message,false);}
  finally{showLoader(false);render();}
}

async function saveAll(){
  showLoader(true,'저장 중…');
  try{
    const wk=toWeekKey(state.weekOffset);
    const tasks=[];
    state.members.forEach(m=>{
      for(let d=0;d<5;d++){
        ((state.tasks[m]||{})[d]||[]).forEach(tk=>{
          tasks.push({member:m,dayIdx:d,taskText:tk.t,category:tk.c});
        });
      }
    });
    const json=await api({action:'write',weekKey:wk,tasks});
    if(json.ok){
      dirty=false; setStatus(`✓ ${json.written}건 저장됨`,true);
      await api({action:'saveMembers',members:state.members});
    }else{
      setStatus('저장 실패: '+(json.error||''),false);
    }
  }catch(e){setStatus('저장 실패: '+e.message,false);}
  finally{showLoader(false);}
}

function render(){
  const dates=getWeekDates(state.weekOffset);
  document.getElementById('week-label').textContent=
    `${fmt(dates[0])} (월) – ${fmt(dates[4])} (금)`;
  document.getElementById('board-head').innerHTML=
    '<tr><th class="name-col">팀원</th>'+
    DAYS.map((d,i)=>`<th>${d} (${fmt(dates[i])})</th>`).join('')+'</tr>';
  const tbody=document.getElementById('board-body');
  tbody.innerHTML='';
  state.members.forEach(m=>{
    const tr=document.createElement('tr');
    const ntd=document.createElement('td');
    ntd.className='name-cell';
    ntd.innerHTML=`<div class="name-inner"><div class="avatar">${esc(m[0])}</div><span>${esc(m)}</span></div>`;
    tr.appendChild(ntd);
    for(let d=0;d<5;d++){
      const td=document.createElement('td');
      const inner=document.createElement('div');
      inner.className='cell-inner';
      ((state.tasks[m]||{})[d]||[]).forEach((tk,ti)=>{
        const chip=document.createElement('button');
        chip.className=`task-chip cat-${tk.c}`;
        chip.innerHTML=`<span class="chip-text">${esc(tk.t)}</span>`+
          `<button class="chip-del" onclick="delTask(${JSON.stringify(m)},${d},${ti},event)">×</button>`;
        chip.addEventListener('click',e=>{
          if(!e.target.classList.contains('chip-del'))openEdit(m,d,ti,tk);
        });
        inner.appendChild(chip);
      });
      const ab=document.createElement('button');
      ab.className='add-task';ab.textContent='+ 추가';
      ab.onclick=()=>openAdd(m,d);
      inner.appendChild(ab);
      td.appendChild(inner);tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function changeWeek(dir){
  if(dirty&&!confirm('저장되지 않은 변경이 있습니다. 이동할까요?'))return;
  state.weekOffset+=dir;
  state.tasks={};state.members.forEach(m=>state.tasks[m]={});
  render();await loadFromSheet();
}

function openAdd(member,dayIdx){
  editing={member,dayIdx,taskIdx:null};
  document.getElementById('modal-title').textContent=`${member} — ${DAYS[dayIdx]}요일 업무 추가`;
  document.getElementById('task-text').value='';
  setSelCat('blue');openModal('task-modal');
  setTimeout(()=>document.getElementById('task-text').focus(),50);
}
function openEdit(member,dayIdx,taskIdx,tk){
  editing={member,dayIdx,taskIdx};
  document.getElementById('modal-title').textContent='업무 수정';
  document.getElementById('task-text').value=tk.t;
  setSelCat(tk.c);openModal('task-modal');
  setTimeout(()=>document.getElementById('task-text').focus(),50);
}
function saveTask(){
  const text=document.getElementById('task-text').value.trim();
  if(!text)return;
  const{member,dayIdx,taskIdx}=editing;
  if(!state.tasks[member])state.tasks[member]={};
  if(!state.tasks[member][dayIdx])state.tasks[member][dayIdx]=[];
  if(taskIdx===null)state.tasks[member][dayIdx].push({t:text,c:selCat});
  else state.tasks[member][dayIdx][taskIdx]={t:text,c:selCat};
  dirty=true;closeModal('task-modal');render();
}
function delTask(member,dayIdx,taskIdx,e){
  e.stopPropagation();
  state.tasks[member][dayIdx].splice(taskIdx,1);
  dirty=true;render();
}
function openMemberModal(){
  document.getElementById('new-member').value='';
  openModal('member-modal');
  setTimeout(()=>document.getElementById('new-member').focus(),50);
}
function addMember(){
  const name=document.getElementById('new-member').value.trim();
  if(name&&!state.members.includes(name)){
    state.members.push(name);
    if(!state.tasks[name])state.tasks[name]={};
    dirty=true;
  }
  closeModal('member-modal');render();
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function setSelCat(cat){
  selCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('selected',b.dataset.cat===cat));
}
function selectCat(btn){setSelCat(btn.dataset.cat);}

document.getElementById('task-text').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))saveTask();
});
document.getElementById('new-member').addEventListener('keydown',e=>{
  if(e.key==='Enter')addMember();
});
['task-modal','member-modal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id===id)closeModal(id);
  });
});
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault();});

state.members.forEach(m=>state.tasks[m]={});
render();
loadFromSheet();
</script>
</body>
</html>
