<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBS 지식콘텐츠IP팀 | 공식 포트폴리오</title>
    
    <!-- Tailwind CSS & 아이콘 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .filter-active { @apply bg-blue-600 text-white border-transparent shadow-lg; }
        .card-hover { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-hover:hover { transform: translateY(-10px); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <!-- Header / Hero Section -->
    <header class="relative bg-slate-950 py-24 md:py-32 overflow-hidden">
        <div class="absolute inset-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        <div class="container mx-auto px-6 relative z-10">
            <div class="max-w-4xl">
                <p class="text-blue-500 font-bold tracking-[0.2em] uppercase mb-4 animate-pulse">Knowledge Content IP Team</p>
                <h1 class="text-5xl md:text-7xl font-black text-white leading-tight mb-8">
                    지식을 <span class="text-blue-500 text-shadow-lg">자산</span>으로,<br>
                    콘텐츠를 <span class="text-blue-500 text-shadow-lg">가치</span>로.
                </h1>
                <p class="text-xl text-slate-400 font-light max-w-2xl leading-relaxed">
                    SBS의 강력한 지식 브랜드를 기반으로 뉴미디어 비즈니스의 새로운 표준을 제시합니다.
                </p>
            </div>
        </div>
    </header>

    <!-- Navigation & Filters -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-200">
        <div class="container mx-auto px-6 py-5 flex flex-col md:flex-row justify-between items-center gap-6">
            <h2 class="text-xl font-black tracking-tighter uppercase">SBS IP Portfolio</h2>
            <div id="filters" class="flex flex-wrap gap-2">
                <button onclick="filterItems('all')" class="filter-btn filter-active px-5 py-2 rounded-full border border-slate-300 text-sm font-bold transition-all">전체보기</button>
                <button onclick="filterItems('ip')" class="filter-btn px-5 py-2 rounded-full border border-slate-300 text-sm font-bold transition-all">주요 IP</button>
                <button onclick="filterItems('collab')" class="filter-btn px-5 py-2 rounded-full border border-slate-300 text-sm font-bold transition-all">협업 레퍼런스</button>
                <button onclick="filterItems('goods')" class="filter-btn px-5 py-2 rounded-full border border-slate-300 text-sm font-bold transition-all">상품/서비스</button>
            </div>
        </div>
    </nav>

    <!-- Main Grid -->
    <main class="container mx-auto px-6 py-16">
        <div id="content-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- 데이터가 로드되면 여기에 카드가 생성됩니다. -->
            <div class="col-span-full text-center py-20 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-4xl mb-4"></i>
                <p>포트폴리오 데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-500 py-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm font-medium">© 2026 SBS 지식콘텐츠IP팀. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
